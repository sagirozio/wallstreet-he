name: (manual) Intraday sectors & breadth (every ~15 min while US market is open)
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: data-update, cancel-in-progress: false }
jobs:
  intraday:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install yfinance pandas
      - run: python scripts/update.py
      - run: python scripts/premarket.py || true
      - run: python scripts/build.py
      - name: Commit
        run: bash scripts/commit.sh "Intraday update" data.json
