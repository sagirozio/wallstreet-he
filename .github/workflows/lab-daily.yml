name: Lab daily bars 2015-2021 (encrypted)
# Daily bars of the site's stocks from Alpaca, encrypted, force-pushed to the orphan branch lab-data (one commit, not main).
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [scripts/lab_daily.py]
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q cryptography
      - run: git clone -q --depth 1 -b ohlc https://github.com/${{ github.repository }} /tmp/ohlc
      - run: python -u scripts/lab_daily.py /tmp/ohlc
        env:
          ALPACA_KEY_ID: ${{ secrets.ALPACA_KEY_ID }}
          ALPACA_SECRET: ${{ secrets.ALPACA_SECRET }}
      - run: |
          mkdir /tmp/ld && cp lab_daily.enc /tmp/ld/ && cd /tmp/ld
          git init -q -b lab-data && git config user.name "lab" && git config user.email "lab@users.noreply.github.com"
          git add lab_daily.enc && git commit -qm "Lab data (encrypted)"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" lab-data
