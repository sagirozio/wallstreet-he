name: Pages – custom domain + HTTPS (manual)
on: workflow_dispatch
permissions:
  pages: write
jobs:
  https:
    runs-on: ubuntu-latest
    steps:
      - env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: |
          gh api repos/${{ github.repository }}/pages --jq '{cname,https_enforced,status,https_certificate}' || true
          gh api -X PUT repos/${{ github.repository }}/pages -f cname=wallstreeter.co.il -F https_enforced=true && echo "HTTPS enforced"
          gh api repos/${{ github.repository }}/pages --jq '{cname,https_enforced,status}'
