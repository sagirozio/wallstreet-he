name: Lab 5-minute bars (encrypted)
# Fetches the 5-minute bars of the days in lab_req.json from Alpaca, encrypted (lab_min.enc), force-pushed to the orphan branch lab-data.
# Runs by hand, or when the list of days or the script changes. The log shows counts only.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [lab_req.json, scripts/lab_minute.py]
permissions:
  contents: write
concurrency: { group: lab-minute, cancel-in-progress: false }
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q cryptography yfinance pandas
      - run: python -u scripts/lab_minute.py
        env:
          ALPACA_KEY_ID: ${{ secrets.ALPACA_KEY_ID }}
          ALPACA_SECRET: ${{ secrets.ALPACA_SECRET }}
      - run: |
          mkdir /tmp/ld && cp lab_min.enc /tmp/ld/ && cd /tmp/ld
          git init -q -b lab-data && git config user.name "lab" && git config user.email "lab@users.noreply.github.com"
          git add lab_min.enc && git commit -qm "Lab data (encrypted)"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" lab-data
