name: Lab 5-minute bars (encrypted)
# Fetches the 5-minute bars of the days in lab_req.json from Alpaca and commits them encrypted (lab_min.enc).
# Manual only. The log shows counts only.
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: lab-minute, cancel-in-progress: false }
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q cryptography yfinance pandas
      - run: python scripts/lab_minute.py
        env:
          ALPACA_KEY_ID: ${{ secrets.ALPACA_KEY_ID }}
          ALPACA_SECRET: ${{ secrets.ALPACA_SECRET }}
      - run: bash scripts/commit.sh "Lab 5-minute bars (encrypted)" lab_min.enc
