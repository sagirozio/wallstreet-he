name: Weekly data backup
# data.json -> backup branch (last 8 weekly copies). The site never loads it.
on:
  schedule:
    - cron: "37 9 * * 0"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: python3 scripts/backup.py
