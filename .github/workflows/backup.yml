name: Nightly data backup
# data.json -> backup branch (last 14 nightly copies). The site never loads it.
on:
  schedule:
    - cron: "37 4 * * *"   # every night (GitHub may skip one; the loop does not depend on it)
  workflow_dispatch:
permissions:
  contents: write
jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: python3 scripts/backup.py
