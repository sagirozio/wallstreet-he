name: Fundamentals (SEC) — daily for new filings, full weekly
on:
  schedule:
    - cron: "17 4 * * 6"     # Saturday morning: all companies
    - cron: "37 3 * * 2-6"   # every night: only companies that filed a 10-Q / 10-K in the last 3 days
  workflow_dispatch:
    inputs:
      tickers: { description: "Optional space-separated tickers (test run)", required: false, default: "" }
concurrency: { group: fundamentals, cancel-in-progress: false }
permissions:
  contents: write
jobs:
  fund:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python scripts/fundamentals.py ${{ github.event_name == 'schedule' && github.event.schedule == '37 3 * * 2-6' && '--recent 3' || github.event.inputs.tickers }}
        env:
          SEC_UA: ${{ secrets.SEC_UA }}
      - name: Commit
        run: |
          git config user.name "wallstreet-bot"
          git config user.email "bot@users.noreply.github.com"
          git add fund
          git diff --cached --quiet || { git commit -m "Fundamentals update (SEC)" && git pull --rebase && git push; }
