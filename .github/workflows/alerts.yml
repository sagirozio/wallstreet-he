name: Watchlist alert mails (after the close)
on:
  schedule:
    - cron: "52 21 * * 1-5"    # ~16:52 New York (winter) — a second and third try below; each user gets one mail per session
    - cron: "38 22 * * 1-5"
    - cron: "24 23 * * 1-5"
  workflow_dispatch:
    inputs:
      dry: { description: "Print the mails instead of sending (1)", default: "" }
concurrency: { group: alerts, cancel-in-progress: false }
permissions:
  contents: write
jobs:
  alerts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - env:
          CLERK_SECRET_KEY: "${{ secrets.CLERK_SECRET_KEY }}"
          RESEND_KEY: "${{ secrets.RESEND_KEY }}"
          GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
        run: python scripts/alerts.py ${{ github.event.inputs.dry == '1' && '--dry' || '' }}
