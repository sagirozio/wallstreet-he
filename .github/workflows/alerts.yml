name: Watchlist alert mails (after the close)
on:
  # schedule paused: email alerts are off for now (needs CLERK_SECRET_KEY, RESEND_KEY and a verified Resend domain)
  workflow_dispatch:
    inputs:
      dry: { description: "Print the mails instead of sending (1)", default: "" }
concurrency: { group: alerts, cancel-in-progress: false }
permissions:
  contents: write
jobs:
  alerts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - env:
          CLERK_SECRET_KEY: "${{ secrets.CLERK_SECRET_KEY }}"
          RESEND_KEY: "${{ secrets.RESEND_KEY }}"
          GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
        run: python scripts/alerts.py ${{ github.event.inputs.dry == '1' && '--dry' || '' }}
