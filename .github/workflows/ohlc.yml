name: OHLC for the own candlestick chart
on:
  workflow_dispatch: {}
  schedule:
    - cron: "17 10 * * 6"   # Saturday morning: Yahoo publishes Friday's final daily bar only some hours after the close, so a run late on Friday can miss it
concurrency: { group: ohlc, cancel-in-progress: false }
permissions:
  contents: write
jobs:
  ohlc:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q yfinance pandas
      - env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: python scripts/ohlc.py
