name: OHLC for the own candlestick chart
on:
  workflow_dispatch: {}
concurrency: { group: ohlc, cancel-in-progress: false }
permissions:
  contents: write
jobs:
  ohlc:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q yfinance pandas
      - run: python scripts/ohlc.py
      - name: Commit
        run: bash scripts/commit.sh "OHLC data for the own candle chart" ohlc
