name: tmp pre-market volume probe
on: { workflow_dispatch: {} }
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - env: { MASSIVE_KEY: "${{ secrets.MASSIVE_KEY }}" }
        run: |
          python - <<'P'
          import os, json, urllib.request, datetime as dt
          K = os.environ["MASSIVE_KEY"]; d = dt.date.today().isoformat()
          for u in [f"https://api.massive.com/v2/aggs/ticker/ZS/range/5/minute/{d}/{d}?adjusted=true&sort=asc&limit=500&apiKey={K}",
                    f"https://api.massive.com/v2/snapshot/locale/us/markets/stocks/tickers/ZS?apiKey={K}"]:
              try:
                  j = json.loads(urllib.request.urlopen(u, timeout=30).read())
                  r = j.get("results") or j.get("ticker")
                  print(u.split("?")[0][-60:], j.get("status"), j.get("resultsCount"), str(r)[:400])
                  if isinstance(r, list): print("sum v", sum(x.get("v", 0) for x in r), "first", r[0] if r else None, "last", r[-1] if r else None)
              except Exception as e: print("ERR", u.split("?")[0][-60:], e)
          P
