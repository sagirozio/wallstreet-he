name: Company background (Yahoo)
on:
  schedule:
    - cron: "23 5 * * *"   # daily early morning UTC; skips companies already fetched
  workflow_dispatch:
concurrency: { group: data-update, cancel-in-progress: false }
permissions:
  contents: write
jobs:
  about:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q yfinance pandas
      - run: python scripts/about.py 700
      - run: python scripts/build.py
      - name: Commit
        run: |
          git config user.name "wallstreet-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data.json index.html about_src.json
          git diff --cached --quiet || git commit -m "Company background update" && git pull --rebase && git push
