name: Company background (Yahoo)
on:
  schedule:
    - cron: "23 5 * * *"   # daily early morning UTC; skips companies already fetched
  workflow_dispatch:
concurrency: { group: about, cancel-in-progress: false }
permissions:
  contents: write
jobs:
  about:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q yfinance pandas
      - run: python scripts/about.py 700
      - name: Commit (own files only, then rebuild the page on top of the latest main)
        run: |
          git config user.name "wallstreet-bot"
          git config user.email "bot@users.noreply.github.com"
          git add facts.json about_src.json
          git diff --cached --quiet && exit 0
          git commit -m "Company background update"
          for i in 1 2 3 4 5; do
            git pull --rebase -X theirs origin main || { git rebase --abort; sleep 10; continue; }
            python scripts/build.py && git add index.html && (git diff --cached --quiet || git commit -m "Rebuild page with company facts")
            git push && exit 0
            sleep 15
          done
          exit 1
