name: Company background (Yahoo)
on:
  schedule:
    - cron: "23 5 * * *"   # daily early morning UTC; skips companies already fetched
  workflow_dispatch:
concurrency: { group: about, cancel-in-progress: false }
permissions:
  contents: write
jobs:
  about:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q yfinance pandas
      - run: python scripts/about.py 700
      - name: Commit
        run: bash scripts/commit.sh "Company background update" facts.json about_src.json
