name: (manual) Pre-market SPY & QQQ (every ~15 min before the US open)
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: data-update, cancel-in-progress: false }
jobs:
  premarket:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q yfinance
      - run: python scripts/premarket.py
      - run: python scripts/build.py
      - name: Commit
        run: bash scripts/commit.sh "Pre-market update" data.json
