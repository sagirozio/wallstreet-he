name: Nightly data update
on:
  schedule:
    - cron: "43 21 * * 1-5"   # ~23:43 Israel (winter), after US close; off-peak minute
    - cron: "19 1 * * 2-6"
    - cron: "25 5 * * 2-6"     # 07:25 Israel: re-run once Massive has the previous session (cross-check)    # backup run ~03:19 Israel in case GitHub skipped the first
  workflow_dispatch:
concurrency: { group: data-update, cancel-in-progress: false }
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install yfinance pandas
      - run: python scripts/update.py
      - env: { MASSIVE_KEY: "${{ secrets.MASSIVE_KEY }}" }
        run: python scripts/themes.py
      - run: timeout 1200 python scripts/autoreports.py recent || true
      - env: { FINNHUB_KEY: "${{ secrets.FINNHUB_KEY }}" }
        run: timeout 1500 python scripts/finnhub_fill.py || true
      - run: python scripts/build.py
      - name: Commit
        run: bash scripts/commit.sh "Nightly data update" data.json industries.json
