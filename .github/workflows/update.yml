name: Nightly data update
on:
  schedule:
    - cron: "43 21-23 * * 1-5"   # after the US close; GitHub drops some scheduled starts, so several tries —
    - cron: "19 0-7 * * 2-6"     # scripts/should_update.py lets one run per close (+ one after 05:00 UTC for Massive)
  workflow_dispatch:
    inputs:
      force: { description: "Run even if not due (1)", default: "" }
concurrency: { group: data-update, cancel-in-progress: false }
permissions:
  contents: write
jobs:
  gate:
    runs-on: ubuntu-latest
    outputs: { go: "${{ steps.g.outputs.go }}" }
    steps:
      - uses: actions/checkout@v4
      - id: g
        run: python3 scripts/should_update.py && echo "go=1" >> "$GITHUB_OUTPUT" || echo "go=0" >> "$GITHUB_OUTPUT"
  update:
    needs: gate
    if: needs.gate.outputs.go == '1' || github.event.inputs.force == '1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install yfinance pandas
      - run: python scripts/update.py
      - env: { MASSIVE_KEY: "${{ secrets.MASSIVE_KEY }}", GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: python scripts/themes.py
      - run: timeout 1200 python scripts/autoreports.py recent || true
      - env: { FINNHUB_KEY: "${{ secrets.FINNHUB_KEY }}" }
        run: timeout 1500 python scripts/finnhub_fill.py || true
      - env: { FINNHUB_KEY: "${{ secrets.FINNHUB_KEY }}" }
        run: timeout 300 python scripts/calendar_auto.py || true
      - run: python scripts/sec_fill.py || true
      - run: timeout 300 python scripts/recap.py || true
      - run: python scripts/build.py
      - name: Commit
        run: bash scripts/commit.sh "Nightly data update" data.json industries.json
