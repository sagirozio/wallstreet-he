name: Nightly data update
on:
  schedule:
    - cron: "30 21 * * 1-5"   # 23:30 Israel (winter) — after US close
  workflow_dispatch:
concurrency: { group: data-update, cancel-in-progress: false }
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install yfinance pandas
      - run: python scripts/update.py
      - run: python scripts/themes.py
      - run: python scripts/build.py
      - name: Commit
        run: |
          git config user.name "wallstreet-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data.json index.html industries.json
          git diff --cached --quiet || git commit -m "Nightly data update" && git push
