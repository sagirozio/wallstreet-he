name: Stock headlines from Finnhub (research for the content runs)
# Before each scheduled Claude content run (midday 10:39, morning 15:13, evening 23:47 Israel time).
on:
  schedule:
    - cron: "40 6 * * 1-5"
    - cron: "15 12 * * 1-5"
    - cron: "5 21 * * 1-5"
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: news-src, cancel-in-progress: false }
jobs:
  news:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - env: { FINNHUB_KEY: "${{ secrets.FINNHUB_KEY }}" }
        run: python scripts/finnhub_news.py
      - run: pip install -q yfinance pandas >/dev/null 2>&1; bash scripts/commit.sh "Stock headlines (Finnhub)" news_src.json
