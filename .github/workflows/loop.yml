name: Intraday loop (pre-market + session, every 10 min)
# Replaces the old every-15-minute crons: one long job loops all day.
# Three starts (UTC) cover the New York pre-market and session in winter and summer time;
# a new start cancels the running one, so a late or dropped start doesn't leave a gap.
on:
  schedule:
    - cron: "55 8 * * 1-5"
    - cron: "15 13 * * 1-5"
    - cron: "15 18 * * 1-5"
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: intraday-loop, cancel-in-progress: true }
jobs:
  loop:
    runs-on: ubuntu-latest
    timeout-minutes: 358
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q yfinance pandas
      - run: python scripts/loop.py
