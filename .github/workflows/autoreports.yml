name: (manual) Basic earnings cards from Yahoo
on:
  workflow_dispatch:
    inputs:
      args: { description: "gainers20 | big N | TICKERS...", default: "gainers20" }
      script: { description: "script", default: "autoreports.py" }
permissions:
  contents: write
concurrency: { group: data-update, cancel-in-progress: false }
jobs:
  cards:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q yfinance pandas lxml
      - env: { FINNHUB_KEY: "${{ secrets.FINNHUB_KEY }}" }
        run: python scripts/${{ github.event.inputs.script || 'autoreports.py' }} ${{ github.event.inputs.args }}
      - run: bash scripts/commit.sh "Basic earnings cards (Yahoo)" data.json
