name: Live quotes (every 3 min during US trading hours)
# One long job per half-day loops every 5 minutes and force-pushes live.json to the `live` branch.
# The second start cancels the first, so the whole session (09:30–16:00 New York) is covered.
on:
  schedule:
    - cron: "24 13-23 * * 1-5"   # UTC, every hour; extra starts queue behind the running one (GitHub drops some)
  workflow_dispatch:
    inputs:
      once: { description: "One round only (1) or the full loop (0)", default: "0" }
permissions:
  contents: write
  actions: write
concurrency: { group: live, cancel-in-progress: false }
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 358
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q yfinance
      - run: python scripts/live.py
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FINNHUB_KEY: ${{ secrets.FINNHUB_KEY }}
          ONCE: ${{ github.event.inputs.once }}
