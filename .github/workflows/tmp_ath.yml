name: tmp ath check
on: workflow_dispatch
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -q yfinance pandas
      - run: |
          python - <<'P'
          import yfinance as yf, pandas as pd, time
          T=["NVDA","AAPL","MSFT","KYMR","AXTI","IREN","ALAB","PLTR","INTC","META"]
          t0=time.time()
          mh=yf.download(T,period="max",interval="1mo",auto_adjust=False,group_by="column",threads=True,progress=False)["High"]
          c=yf.download(T,period="5d",interval="1d",auto_adjust=False,group_by="column",threads=True,progress=False)["Close"].ffill().iloc[-1]
          for t in T: print(t, round(float(mh[t].dropna().max()),2), round(float(c[t]),2), round((float(c[t])/float(mh[t].dropna().max())-1)*100,1))
          print("secs",round(time.time()-t0,1))
          P
